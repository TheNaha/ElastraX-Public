[project]
name = "elastra-modal-adapter"
version = "0.1.0"
description = "Experimental private Modal proxy for a pinned text/tool vLLM model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.136.0",
  "httpx==0.28.1",
  "huggingface-hub==0.36.2",
  "modal==1.5.5",
  "starlette==1.0.1",
  "tokenizers==0.22.2",
  "transformers==4.57.6",
  "vllm==0.16.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
