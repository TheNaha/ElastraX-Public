services:
  bot:
    # --- OPTION 1: Pull pre-built from GitHub (Recommended for VPSS/Servers) ---
    # image: ghcr.io/thenaha/elastrax:latest
    
    # --- OPTION 2: Build Locally (Uncomment below and comment OPTION 1) ---
    build:
      context: .
      dockerfile: Dockerfile

    container_name: elastrax-bot
    volumes:
      # We only need to mount the persistent data and logs now!
      # We no longer mount the live source code or node_modules because it is baked into the image.
      - ./data:/usr/src/app/data
    restart: unless-stopped
    ports:
      # Both sides follow WEBHOOK_PORT from .env (host:container)
      - "${WEBHOOK_PORT:-3500}:${WEBHOOK_PORT:-3500}"
    env_file:
      - .env
    # NOTE: the healthcheck is defined once in the Dockerfile (HEALTHCHECK),
    # probing GET /health on $WEBHOOK_PORT — do not duplicate it here.
    networks:
       - proxy
    # We no longer need the command override since the Dockerfile CMD will run the compiled app

  # ── Optional continuous backup sidecar (Litestream) ────────────────────────
  # Start with: docker compose --profile backup up -d
  # Requires LITESTREAM_REPLICA_URL in .env (s3://…, sftp://…, etc.) and
  # litestream.yml mounted — see litestream.yml.example. Shares ./data so it can
  # replicate data/bot.db (and read snapshots under data/backups) directly.
  litestream:
    image: litestream/litestream:latest
    container_name: elastrax-litestream
    profiles: ["backup"]
    depends_on:
      - bot
    volumes:
      - ./data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    env_file:
      - .env
    restart: unless-stopped
    networks:
       - proxy

networks:
  proxy:
    external: true
    name: proxy
