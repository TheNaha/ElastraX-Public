services:
  bot:
    # --- OPTION 1: Pull pre-built from GitHub (Recommended for VPSS/Servers) ---
    # image: ghcr.io/thenaha/elastrax:latest
    
    # --- OPTION 2: Build Locally (Uncomment below and comment OPTION 1) ---
    build:
      context: .
      dockerfile: Dockerfile

    container_name: elastrax-bot
    volumes:
      # We only need to mount the persistent data and logs now!
      # We no longer mount the live source code or node_modules because it is baked into the image.
      - ./data:/usr/src/app/data
    restart: unless-stopped
    ports:
      - "3500:3500"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (process.env.WEBHOOK_PORT || 3500) + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # We no longer need the command override since the Dockerfile CMD will run the compiled app

