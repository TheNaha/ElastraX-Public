services:
  bot:
    image: ${ELASTRAX_IMAGE:-ghcr.io/thenaha/elastrax:v8.0.1}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ELASTRAX_DB_PATH: /app/data/bot.db
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_CONTAINER_MODE: "true"
      WEBHOOK_PORT: ${WEBHOOK_PORT:-3500}
    expose:
      - "${WEBHOOK_PORT:-3500}"
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-3500}:${WEBHOOK_PORT:-3500}"
    volumes:
      - elastrax-data:/app/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 30s

  litestream:
    image: litestream/litestream:0.5.10@sha256:66c0ef32779b20f7ce682751ec50ba0f1363cad5cb9dba1e23fbeee6ae3197b9
    profiles:
      - backup
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY-}
    volumes:
      - elastrax-data:/data
      - "${LITESTREAM_CONFIG:-./litestream.yml.example}:/etc/litestream.yml:ro"
    networks:
      - backup
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  elastrax-data:

networks:
  backup:
    internal: true
  proxy:
    external: true
    name: proxy
