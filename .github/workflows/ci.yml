name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify source, migrations, secrets, and image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.28.0_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o "$archive"
          printf '%s  %s\n' \
            a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Secret gate
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --timeout 120

      - name: Dependency advisory gate
        run: bun audit --audit-level=high

      - name: Migration drift gate
        run: |
          bun run db:generate
          drift="$(git status --porcelain --untracked-files=all -- drizzle.config.ts drizzle src/db/schema.ts)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            exit 1
          fi

      - name: Migration smoke
        run: bun test test/migration.test.ts

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test:hermetic

      - name: Provider staging harness
        run: bun run provider:staging

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build pinned container image
        run: docker build --pull --tag elastrax:ci .

      - name: Smoke non-root container and webhook routes
        shell: bash
        run: |
          set -euo pipefail
          volume="elastrax-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume" >/dev/null
          trap 'docker volume rm -f "$volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$volume:/app/data" \
            --env WEBHOOK_ENABLED=true \
            --env WEBHOOK_PORT=0 \
            --env WEBHOOK_SECRET=ci-container-secret-0123456789abcdef \
            --entrypoint bun \
            elastrax:ci \
            -e '
              import { readFile, writeFile } from "node:fs/promises";
              import { WebhookServer } from "./src/webhookServer.ts";
              if (process.getuid?.() === 0) throw new Error("container is running as root");
              await writeFile("/app/data/smoke", "writable", { mode: 0o600 });
              if (await readFile("/app/data/smoke", "utf8") !== "writable") throw new Error("data volume is not writable");
              const server = new WebhookServer();
              server.start();
              const port = server.server?.port;
              if (typeof port !== "number") throw new Error("server did not start");
              const live = await fetch(`http://127.0.0.1:${port}/live`);
              if (live.status !== 200) throw new Error(`live returned ${live.status}`);
              const metrics = await fetch(`http://127.0.0.1:${port}/metrics`);
              if (metrics.status !== 404) throw new Error(`unprotected metrics returned ${metrics.status}`);
              const webhook = await fetch(`http://127.0.0.1:${port}/webhook`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ room_id: "100", text: "smoke" }),
              });
              if (webhook.status !== 401) throw new Error(`unauthenticated webhook returned ${webhook.status}`);
              server.stop();
            '
