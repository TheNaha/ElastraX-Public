name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the oven/bun tag in the Dockerfile (1.3.x line)
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Database Client
        run: bun run db:generate || true

      - name: Run Lint
        run: bun run lint

      - name: Typecheck (src + tests)
        run: bun run typecheck

      - name: Run Tests With Coverage
        run: bun run test:coverage
